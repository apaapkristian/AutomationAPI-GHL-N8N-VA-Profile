<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">One Oracle Cloud VM running multiple production services</title>
  <desc id="desc">A clean infrastructure diagram showing Discord bots, APIs, workers and schedulers managed on one Ubuntu server with systemd, centralized logs and controlled deployments.</desc>
  <defs>
    <style>
      .bg{fill:#f4f0e7}.paper{fill:#fffdf8}.ink{fill:#14221f}.muted{fill:#5f6b66}.orange{fill:#ff5a35}.green{fill:#1e6b52}.line{stroke:#14221f;stroke-width:2;fill:none}.softline{stroke:#c8c2b6;stroke-width:1.5;fill:none}.dash{stroke:#5f6b66;stroke-width:1.5;stroke-dasharray:6 7;fill:none}
      .kicker{font:700 14px Consolas,monospace;letter-spacing:1.7px;fill:#c93618}.title{font:700 45px Arial,sans-serif;letter-spacing:-1.8px;fill:#14221f}.sub{font:400 18px Arial,sans-serif;fill:#5f6b66}.label{font:700 12px Consolas,monospace;letter-spacing:1px;fill:#5f6b66}.h{font:700 24px Arial,sans-serif;letter-spacing:-.6px;fill:#14221f}.body{font:400 15px Arial,sans-serif;fill:#5f6b66}.small{font:700 12px Arial,sans-serif;fill:#14221f}.mono{font:400 12px Consolas,monospace;fill:#5f6b66}.white{fill:#fffdf8}
    </style>
  </defs>
  <rect class="bg" width="1200" height="720"/>
  <rect x="34" y="34" width="1132" height="652" fill="none" stroke="#14221f" stroke-width="2"/>

  <text x="72" y="87" class="kicker">FEATURED INFRASTRUCTURE / RESELLING SECRETS</text>
  <text x="72" y="143" class="title">One Oracle VM. Many production services.</text>
  <text x="72" y="177" class="sub">A controlled home for always-on bots, APIs, workers, schedulers, logs, and deployments.</text>
  <g transform="translate(925 75)">
    <rect width="200" height="92" class="ink"/>
    <text x="20" y="30" class="label white">PRODUCTION BASELINE</text>
    <text x="20" y="61" font-family="Arial,sans-serif" font-size="19" font-weight="700" class="white">10+ services · 24/7</text>
  </g>

  <g transform="translate(72 230)">
    <rect width="330" height="292" class="paper" stroke="#14221f" stroke-width="2"/>
    <text x="24" y="36" class="label">HOSTED WORKLOADS</text>
    <g transform="translate(24 62)">
      <rect width="282" height="52" fill="#f4f0e7" stroke="#c8c2b6"/>
      <circle cx="26" cy="26" r="8" fill="#5865f2"/><text x="46" y="31" class="small">Discord bot services</text>
      <rect y="62" width="282" height="52" fill="#f4f0e7" stroke="#c8c2b6"/>
      <circle cx="26" cy="88" r="8" class="orange"/><text x="46" y="93" class="small">REST APIs + webhooks</text>
      <rect y="124" width="282" height="52" fill="#f4f0e7" stroke="#c8c2b6"/>
      <circle cx="26" cy="150" r="8" fill="#ea4b71"/><text x="46" y="155" class="small">n8n workers + integrations</text>
      <rect y="186" width="282" height="52" fill="#f4f0e7" stroke="#c8c2b6"/>
      <circle cx="26" cy="212" r="8" class="green"/><text x="46" y="217" class="small">Schedulers + admin tools</text>
    </g>
  </g>

  <path d="M402 376H468" class="line"/>
  <path d="M452 364l16 12-16 12" class="ink"/>

  <g transform="translate(468 230)">
    <rect width="310" height="292" class="ink"/>
    <text x="28" y="38" class="label white">ONE MANAGED COMPUTE ALLOCATION</text>
    <rect x="28" y="64" width="254" height="104" fill="#1e6b52"/>
    <text x="48" y="97" class="label white">ORACLE CLOUD</text>
    <text x="48" y="130" font-family="Arial,sans-serif" font-size="28" font-weight="700" class="white">Ubuntu VM</text>
    <text x="48" y="153" font-family="Consolas,monospace" font-size="11" class="white">secure access · private env</text>
    <line x1="28" y1="196" x2="282" y2="196" stroke="#586b65"/>
    <text x="28" y="226" class="mono white">$ systemctl --type=service</text>
    <circle cx="35" cy="252" r="6" fill="#65d49a"/>
    <text x="52" y="257" class="mono white">all required processes active</text>
  </g>

  <path d="M778 376H844" class="line"/>
  <path d="M828 364l16 12-16 12" class="ink"/>

  <g transform="translate(844 230)">
    <rect width="282" height="292" class="paper" stroke="#14221f" stroke-width="2"/>
    <text x="24" y="36" class="label">OPERATIONS LAYER</text>
    <g transform="translate(24 68)">
      <text class="h" y="0">systemd</text><text class="body" y="24">starts and restarts services</text>
      <line y1="43" x2="234" y2="43" class="softline"/>
      <text class="h" y="81">journal logs</text><text class="body" y="105">one place to inspect failures</text>
      <line y1="124" x2="234" y2="124" class="softline"/>
      <text class="h" y="162">controlled deploys</text><text class="body" y="186">SSH, GitHub, and admin tooling</text>
    </g>
  </g>

  <g transform="translate(72 574)">
    <line x1="0" y1="0" x2="1054" y2="0" class="softline"/>
    <text x="0" y="38" class="label">WHY IT MATTERS</text>
    <text x="160" y="38" class="body">Several connected services share one infrastructure baseline while keeping separate processes, secrets, logs, and restart rules.</text>
    <rect x="0" y="66" width="1054" height="1" fill="#c8c2b6"/>
    <text x="0" y="98" class="mono">Hosted: APIs · bots · workers · schedulers</text>
    <text x="408" y="98" class="mono">Connected: Discord · n8n · third-party services</text>
    <text x="875" y="98" class="mono">Status: healthy</text>
  </g>
</svg>
