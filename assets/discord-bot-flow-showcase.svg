<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Discord operations automation flow</title>
  <desc id="desc">A five-step workflow showing Discord events and staff commands moving through permissions, business logic, APIs, operational actions, and audit logs.</desc>
  <defs>
    <style>
      .bg{fill:#f4f0e7}.paper{fill:#fffdf8}.ink{fill:#14221f}.orange{fill:#ff5a35}.green{fill:#1e6b52}.purple{fill:#5865f2}.line{stroke:#14221f;stroke-width:2;fill:none}.soft{stroke:#c8c2b6;stroke-width:1.5;fill:none}
      .kicker{font:700 14px Consolas,monospace;letter-spacing:1.7px;fill:#c93618}.title{font:700 46px Arial,sans-serif;letter-spacing:-1.8px;fill:#14221f}.sub{font:400 18px Arial,sans-serif;fill:#5f6b66}.num{font:700 12px Consolas,monospace;fill:#c93618}.h{font:700 20px Arial,sans-serif;letter-spacing:-.4px;fill:#14221f}.body{font:400 14px Arial,sans-serif;fill:#5f6b66}.label{font:700 11px Consolas,monospace;letter-spacing:.8px;fill:#5f6b66}.small{font:700 12px Arial,sans-serif;fill:#14221f}.white{fill:#fffdf8}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1l8 4-8 4z" fill="#14221f"/></marker>
  </defs>
  <rect class="bg" width="1200" height="720"/>
  <rect x="34" y="34" width="1132" height="652" fill="none" stroke="#14221f" stroke-width="2"/>
  <text x="72" y="87" class="kicker">DISCORD OPERATIONS / AUTOMATION FLOW</text>
  <text x="72" y="143" class="title">More than a chatbot: an operations layer.</text>
  <text x="72" y="177" class="sub">Commands, community events, permissions, API actions, and staff visibility—connected in one workflow.</text>
  <g transform="translate(953 72)"><rect width="173" height="92" class="purple"/><text x="18" y="30" class="label white">PLATFORM</text><text x="18" y="63" font-family="Arial,sans-serif" font-size="25" font-weight="700" class="white">Discord API</text></g>

  <g transform="translate(72 250)">
    <g>
      <rect width="184" height="180" class="paper" stroke="#14221f" stroke-width="2"/>
      <rect width="184" height="12" class="purple"/>
      <text x="20" y="43" class="num">01 / INPUT</text>
      <text x="20" y="79" class="h">Community event</text>
      <text x="20" y="108" class="body">slash command</text><text x="20" y="130" class="body">role or member event</text><text x="20" y="152" class="body">scheduled trigger</text>
    </g>
    <path d="M184 90H218" class="line" marker-end="url(#arrow)"/>
    <g transform="translate(228)">
      <rect width="184" height="180" class="paper" stroke="#14221f" stroke-width="2"/>
      <rect width="184" height="12" class="orange"/>
      <text x="20" y="43" class="num">02 / GUARD</text>
      <text x="20" y="79" class="h">Permission check</text>
      <text x="20" y="108" class="body">staff role</text><text x="20" y="130" class="body">server and channel</text><text x="20" y="152" class="body">validated input</text>
    </g>
    <path d="M412 90H446" class="line" marker-end="url(#arrow)"/>
    <g transform="translate(456)">
      <rect width="184" height="180" class="ink"/>
      <rect width="184" height="12" class="green"/>
      <text x="20" y="43" class="num white">03 / LOGIC</text>
      <text x="20" y="79" class="h white">Bot service</text>
      <text x="20" y="108" class="body white">route the request</text><text x="20" y="130" class="body white">call APIs</text><text x="20" y="152" class="body white">handle exceptions</text>
    </g>
    <path d="M640 90H674" class="line" marker-end="url(#arrow)"/>
    <g transform="translate(684)">
      <rect width="184" height="180" class="paper" stroke="#14221f" stroke-width="2"/>
      <rect width="184" height="12" class="orange"/>
      <text x="20" y="43" class="num">04 / ACTION</text>
      <text x="20" y="79" class="h">Operational result</text>
      <text x="20" y="108" class="body">post or DM</text><text x="20" y="130" class="body">assign or archive</text><text x="20" y="152" class="body">sync external data</text>
    </g>
    <path d="M868 90H902" class="line" marker-end="url(#arrow)"/>
    <g transform="translate(912)">
      <rect width="184" height="180" class="paper" stroke="#14221f" stroke-width="2"/>
      <rect width="184" height="12" class="green"/>
      <text x="20" y="43" class="num">05 / RECORD</text>
      <text x="20" y="79" class="h">Audit + status</text>
      <text x="20" y="108" class="body">staff confirmation</text><text x="20" y="130" class="body">centralized log</text><text x="20" y="152" class="body">failure alert</text>
    </g>
  </g>

  <g transform="translate(72 484)">
    <rect width="510" height="132" class="paper" stroke="#c8c2b6"/>
    <text x="24" y="33" class="label">STAFF-FACING WORKFLOWS</text>
    <text x="24" y="68" class="h">Commands that manage real operations</text>
    <text x="24" y="96" class="body">Archive threads · control other bots · publish alerts · run checks</text>
    <rect x="24" y="110" width="78" height="4" class="orange"/>
  </g>
  <g transform="translate(598 484)">
    <rect width="498" height="132" class="paper" stroke="#c8c2b6"/>
    <text x="24" y="33" class="label">CONNECTED BACKEND</text>
    <text x="24" y="68" class="h">Hosted on the managed Oracle stack</text>
    <text x="24" y="96" class="body">Python / Node.js · REST APIs · webhooks · systemd services</text>
    <rect x="24" y="110" width="78" height="4" class="green"/>
  </g>
  <text x="72" y="657" class="label">OUTCOME / FASTER STAFF ACTIONS · CONSISTENT RULES · VISIBLE FAILURES · LESS REPEATED ADMIN</text>
</svg>
