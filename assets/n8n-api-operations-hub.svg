<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">n8n integration and API operations workflow</title>
  <desc id="desc">A clean diagram showing Discord, GoHighLevel and web forms feeding an n8n workflow that validates, routes, retries and sends data to Telnyx, Google Sheets and custom APIs.</desc>
  <defs>
    <style>
      .bg{fill:#f4f0e7}.paper{fill:#fffdf8}.ink{fill:#14221f}.orange{fill:#ff5a35}.green{fill:#1e6b52}.pink{fill:#ea4b71}.purple{fill:#5865f2}.line{stroke:#14221f;stroke-width:2;fill:none}.soft{stroke:#c8c2b6;stroke-width:1.5;fill:none}
      .kicker{font:700 14px Consolas,monospace;letter-spacing:1.7px;fill:#c93618}.title{font:700 46px Arial,sans-serif;letter-spacing:-1.8px;fill:#14221f}.sub{font:400 18px Arial,sans-serif;fill:#5f6b66}.label{font:700 11px Consolas,monospace;letter-spacing:.9px;fill:#5f6b66}.h{font:700 21px Arial,sans-serif;letter-spacing:-.4px;fill:#14221f}.body{font:400 14px Arial,sans-serif;fill:#5f6b66}.mono{font:400 12px Consolas,monospace;fill:#5f6b66}.white{fill:#fffdf8}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1l8 4-8 4z" fill="#14221f"/></marker>
  </defs>
  <rect class="bg" width="1200" height="720"/>
  <rect x="34" y="34" width="1132" height="652" fill="none" stroke="#14221f" stroke-width="2"/>
  <text x="72" y="87" class="kicker">N8N / INTEGRATION OPERATIONS</text>
  <text x="72" y="143" class="title">One workflow layer between all the moving parts.</text>
  <text x="72" y="177" class="sub">Receive events, clean the payload, apply business rules, retry failures, and deliver data to the right app.</text>

  <g transform="translate(72 225)">
    <text class="label" y="0">EVENT SOURCES</text>
    <g transform="translate(0 24)">
      <rect width="220" height="78" class="paper" stroke="#14221f" stroke-width="2"/>
      <circle cx="34" cy="39" r="12" class="purple"/><text x="58" y="34" class="h">Discord</text><text x="58" y="55" class="body">commands + events</text>
    </g>
    <g transform="translate(0 116)">
      <rect width="220" height="78" class="paper" stroke="#14221f" stroke-width="2"/>
      <circle cx="34" cy="39" r="12" fill="#2864dc"/><text x="58" y="34" class="h">GoHighLevel</text><text x="58" y="55" class="body">contacts + pipelines</text>
    </g>
    <g transform="translate(0 208)">
      <rect width="220" height="78" class="paper" stroke="#14221f" stroke-width="2"/>
      <circle cx="34" cy="39" r="12" class="orange"/><text x="58" y="34" class="h">Forms + APIs</text><text x="58" y="55" class="body">webhook payloads</text>
    </g>
  </g>

  <path d="M292 288H376M292 380H376M292 472H376" class="line"/>
  <path d="M358 276l18 12-18 12M358 368l18 12-18 12M358 460l18 12-18 12" class="ink"/>

  <g transform="translate(376 225)">
    <rect width="438" height="310" class="ink"/>
    <rect width="438" height="16" class="pink"/>
    <text x="28" y="51" class="label white">N8N WORKFLOW</text>
    <text x="28" y="88" font-family="Arial,sans-serif" font-size="29" font-weight="700" class="white">Validate → route → retry</text>
    <g transform="translate(28 120)">
      <rect width="174" height="60" fill="#fffdf8"/>
      <text x="16" y="24" class="label">01 / CLEAN</text><text x="16" y="46" class="body">match fields + types</text>
      <rect x="208" width="174" height="60" fill="#fffdf8"/>
      <text x="224" y="24" class="label">02 / DECIDE</text><text x="224" y="46" class="body">branch by status</text>
      <rect y="76" width="174" height="60" fill="#fffdf8"/>
      <text x="16" y="100" class="label">03 / PROTECT</text><text x="16" y="122" class="body">retry + error route</text>
      <rect x="208" y="76" width="174" height="60" fill="#fffdf8"/>
      <text x="224" y="100" class="label">04 / RECORD</text><text x="224" y="122" class="body">log the result</text>
    </g>
    <text x="28" y="285" class="mono white">workflow status: active · failures visible</text>
  </g>

  <path d="M814 288H898M814 380H898M814 472H898" class="line"/>
  <path d="M880 276l18 12-18 12M880 368l18 12-18 12M880 460l18 12-18 12" class="ink"/>

  <g transform="translate(898 225)">
    <text class="label" y="0">DESTINATIONS</text>
    <g transform="translate(0 24)">
      <rect width="230" height="78" class="paper" stroke="#14221f" stroke-width="2"/>
      <circle cx="34" cy="39" r="12" class="green"/><text x="58" y="34" class="h">Telnyx</text><text x="58" y="55" class="body">SMS + status</text>
    </g>
    <g transform="translate(0 116)">
      <rect width="230" height="78" class="paper" stroke="#14221f" stroke-width="2"/>
      <circle cx="34" cy="39" r="12" fill="#2f9e58"/><text x="58" y="34" class="h">Google Sheets</text><text x="58" y="55" class="body">operational records</text>
    </g>
    <g transform="translate(0 208)">
      <rect width="230" height="78" class="paper" stroke="#14221f" stroke-width="2"/>
      <circle cx="34" cy="39" r="12" class="orange"/><text x="58" y="34" class="h">Custom APIs</text><text x="58" y="55" class="body">hosted endpoints</text>
    </g>
  </g>

  <g transform="translate(72 584)">
    <line x1="0" y1="0" x2="1056" y2="0" class="soft"/>
    <text y="36" class="label">WHAT THIS REMOVES</text>
    <text x="175" y="36" class="body">Copying data · checking multiple dashboards · silent webhook failures · repeated staff follow-up</text>
    <rect y="62" width="1056" height="42" class="ink"/>
    <text x="18" y="88" class="label white">OUTCOME / ONE VISIBLE ROUTE FOR DATA MOVING BETWEEN THE BUSINESS TOOLS</text>
  </g>
</svg>
