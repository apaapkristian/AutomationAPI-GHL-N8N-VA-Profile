<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">GoHighLevel, n8n and Telnyx customer follow-up workflow</title>
  <desc id="desc">A customer automation diagram showing a lead entering GoHighLevel, workflow rules running through n8n, compliant SMS delivery through Telnyx, and replies returning to the CRM and staff.</desc>
  <defs>
    <style>
      .bg{fill:#f4f0e7}.paper{fill:#fffdf8}.ink{fill:#14221f}.orange{fill:#ff5a35}.green{fill:#1e6b52}.pink{fill:#ea4b71}.blue{fill:#2864dc}.line{stroke:#14221f;stroke-width:2;fill:none}.soft{stroke:#c8c2b6;stroke-width:1.5;fill:none}
      .kicker{font:700 14px Consolas,monospace;letter-spacing:1.7px;fill:#c93618}.title{font:700 46px Arial,sans-serif;letter-spacing:-1.8px;fill:#14221f}.sub{font:400 18px Arial,sans-serif;fill:#5f6b66}.label{font:700 11px Consolas,monospace;letter-spacing:.9px;fill:#5f6b66}.h{font:700 21px Arial,sans-serif;letter-spacing:-.4px;fill:#14221f}.body{font:400 14px Arial,sans-serif;fill:#5f6b66}.small{font:700 12px Arial,sans-serif;fill:#14221f}.white{fill:#fffdf8}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1l8 4-8 4z" fill="#14221f"/></marker>
  </defs>
  <rect class="bg" width="1200" height="720"/>
  <rect x="34" y="34" width="1132" height="652" fill="none" stroke="#14221f" stroke-width="2"/>
  <text x="72" y="87" class="kicker">CUSTOMER AUTOMATION / CRM + WORKFLOWS + SMS</text>
  <text x="72" y="143" class="title">From new lead to human reply—without losing context.</text>
  <text x="72" y="177" class="sub">GoHighLevel holds the customer record. n8n handles logic. Telnyx sends and receives messages.</text>

  <g transform="translate(72 235)">
    <g>
      <circle cx="62" cy="62" r="62" class="orange"/>
      <text x="62" y="53" text-anchor="middle" class="label white">INPUT</text>
      <text x="62" y="78" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" class="white">Form / ad</text>
      <text x="62" y="99" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" class="white">new lead</text>
    </g>
    <path d="M124 62H190" class="line" marker-end="url(#arrow)"/>
    <g transform="translate(202)">
      <rect width="206" height="124" class="paper" stroke="#14221f" stroke-width="2"/>
      <rect width="206" height="12" class="blue"/>
      <text x="20" y="43" class="label">GOHIGHLEVEL</text>
      <text x="20" y="74" class="h">Contact + pipeline</text>
      <text x="20" y="99" class="body">source · stage · owner</text>
    </g>
    <path d="M408 62H474" class="line" marker-end="url(#arrow)"/>
    <g transform="translate(486)">
      <rect width="206" height="124" class="ink"/>
      <rect width="206" height="12" class="pink"/>
      <text x="20" y="43" class="label white">N8N WORKFLOW</text>
      <text x="20" y="74" class="h white">Rules + routing</text>
      <text x="20" y="99" class="body white">consent · timing · branch</text>
    </g>
    <path d="M692 62H758" class="line" marker-end="url(#arrow)"/>
    <g transform="translate(770)">
      <rect width="206" height="124" class="paper" stroke="#14221f" stroke-width="2"/>
      <rect width="206" height="12" class="green"/>
      <text x="20" y="43" class="label">TELNYX SMS</text>
      <text x="20" y="74" class="h">Send + receive</text>
      <text x="20" y="99" class="body">message status · reply</text>
    </g>
    <path d="M976 62H1034" class="line" marker-end="url(#arrow)"/>
    <g transform="translate(1046)">
      <circle cx="25" cy="62" r="25" class="green"/>
      <path d="M14 62l8 8 16-20" fill="none" stroke="#fffdf8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <g transform="translate(72 408)">
    <text class="label" y="0">WORKFLOW LOGIC THAT THE TEAM CAN SEE</text>
    <g transform="translate(0 26)">
      <rect width="250" height="126" class="paper" stroke="#c8c2b6"/>
      <text x="22" y="32" class="label">01 / QUALIFY</text>
      <text x="22" y="65" class="h">Check consent</text>
      <text x="22" y="91" class="body">Stop messages when opt-in</text><text x="22" y="112" class="body">or contact rules do not match.</text>
    </g>
    <g transform="translate(266 26)">
      <rect width="250" height="126" class="paper" stroke="#c8c2b6"/>
      <text x="22" y="32" class="label">02 / FOLLOW UP</text>
      <text x="22" y="65" class="h">Send at the right time</text>
      <text x="22" y="91" class="body">Immediate confirmation, wait</text><text x="22" y="112" class="body">steps, and failed-payment nudges.</text>
    </g>
    <g transform="translate(532 26)">
      <rect width="250" height="126" class="paper" stroke="#c8c2b6"/>
      <text x="22" y="32" class="label">03 / LISTEN</text>
      <text x="22" y="65" class="h">Capture replies</text>
      <text x="22" y="91" class="body">Write the response back to</text><text x="22" y="112" class="body">the CRM with message status.</text>
    </g>
    <g transform="translate(798 26)">
      <rect width="258" height="126" class="paper" stroke="#c8c2b6"/>
      <text x="22" y="32" class="label">04 / HAND OFF</text>
      <text x="22" y="65" class="h">Notify a person</text>
      <text x="22" y="91" class="body">Alert the right staff member</text><text x="22" y="112" class="body">with the customer context attached.</text>
    </g>
  </g>

  <g transform="translate(72 609)">
    <rect width="1056" height="44" class="ink"/>
    <text x="18" y="28" class="label white">CONNECTED APPS</text>
    <text x="185" y="28" class="small white">GoHighLevel</text>
    <text x="340" y="28" class="small white">n8n</text>
    <text x="445" y="28" class="small white">Telnyx</text>
    <text x="565" y="28" class="small white">Webhooks</text>
    <text x="715" y="28" class="small white">Internal API</text>
    <text x="888" y="28" class="small white">Staff alerts</text>
  </g>
</svg>
