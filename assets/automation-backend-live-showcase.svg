<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Complete automation and backend systems map</title>
  <desc id="desc">An editorial diagram showing customer and community channels connected to n8n and custom APIs, supported by Oracle Cloud infrastructure, and producing operational outcomes.</desc>
  <defs>
    <style>
      .bg{fill:#f4f0e7}.paper{fill:#fffdf8}.ink{fill:#14221f}.orange{fill:#ff5a35}.green{fill:#1e6b52}.pink{fill:#ea4b71}.purple{fill:#5865f2}.blue{fill:#2864dc}.line{stroke:#14221f;stroke-width:2;fill:none}.soft{stroke:#c8c2b6;stroke-width:1.5;fill:none}
      .kicker{font:700 14px Consolas,monospace;letter-spacing:1.7px;fill:#c93618}.title{font:700 46px Arial,sans-serif;letter-spacing:-1.8px;fill:#14221f}.sub{font:400 18px Arial,sans-serif;fill:#5f6b66}.label{font:700 11px Consolas,monospace;letter-spacing:.9px;fill:#5f6b66}.h{font:700 20px Arial,sans-serif;letter-spacing:-.4px;fill:#14221f}.body{font:400 13px Arial,sans-serif;fill:#5f6b66}.white{fill:#fffdf8}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1l8 4-8 4z" fill="#14221f"/></marker>
  </defs>
  <rect class="bg" width="1200" height="720"/>
  <rect x="34" y="34" width="1132" height="652" fill="none" stroke="#14221f" stroke-width="2"/>
  <text x="72" y="87" class="kicker">SYSTEM MAP / AUTOMATION + BACKEND</text>
  <text x="72" y="143" class="title">The useful part is what happens between the apps.</text>
  <text x="72" y="177" class="sub">One operations layer connecting channels, workflows, APIs, infrastructure, and the people responsible.</text>

  <g transform="translate(72 232)">
    <text class="label" y="0">01 / BUSINESS CHANNELS</text>
    <g transform="translate(0 26)">
      <rect width="226" height="72" class="paper" stroke="#14221f" stroke-width="2"/>
      <rect width="10" height="72" class="purple"/><text x="30" y="31" class="h">Discord</text><text x="30" y="53" class="body">community + staff</text>
    </g>
    <g transform="translate(0 112)">
      <rect width="226" height="72" class="paper" stroke="#14221f" stroke-width="2"/>
      <rect width="10" height="72" class="blue"/><text x="30" y="31" class="h">GoHighLevel</text><text x="30" y="53" class="body">CRM + pipelines</text>
    </g>
    <g transform="translate(0 198)">
      <rect width="226" height="72" class="paper" stroke="#14221f" stroke-width="2"/>
      <rect width="10" height="72" class="orange"/><text x="30" y="31" class="h">Forms + data</text><text x="30" y="53" class="body">leads + internal records</text>
    </g>
  </g>

  <path d="M298 294H372M298 380H372M298 466H372" class="line"/>
  <path d="M354 282l18 12-18 12M354 368l18 12-18 12M354 454l18 12-18 12" class="ink"/>

  <g transform="translate(372 232)">
    <text class="label" y="0">02 / AUTOMATION LAYER</text>
    <rect y="26" width="420" height="244" class="ink"/>
    <g transform="translate(24 24)">
      <rect y="26" width="174" height="82" class="pink"/>
      <text x="18" y="55" class="label white">N8N</text><text x="18" y="84" class="h white">Workflow logic</text>
      <rect x="198" y="26" width="174" height="82" class="orange"/>
      <text x="216" y="55" class="label white">CUSTOM APIS</text><text x="216" y="84" class="h white">Business rules</text>
      <rect y="124" width="372" height="70" fill="#fffdf8"/>
      <text x="18" y="152" class="label">SHARED OPERATIONS</text>
      <text x="18" y="178" class="body">validate · route · sync · retry · alert · record</text>
    </g>
  </g>

  <path d="M792 355H862" class="line" marker-end="url(#arrow)"/>

  <g transform="translate(862 232)">
    <text class="label" y="0">03 / OUTCOMES</text>
    <g transform="translate(0 26)">
      <rect width="266" height="52" class="paper" stroke="#c8c2b6"/>
      <circle cx="26" cy="26" r="7" class="green"/><text x="46" y="31" class="h">Customer follow-up</text>
      <rect y="64" width="266" height="52" class="paper" stroke="#c8c2b6"/>
      <circle cx="26" cy="90" r="7" class="green"/><text x="46" y="95" class="h">Staff notifications</text>
      <rect y="128" width="266" height="52" class="paper" stroke="#c8c2b6"/>
      <circle cx="26" cy="154" r="7" class="green"/><text x="46" y="159" class="h">Data synchronized</text>
      <rect y="192" width="266" height="52" class="paper" stroke="#c8c2b6"/>
      <circle cx="26" cy="218" r="7" class="green"/><text x="46" y="223" class="h">Failures visible</text>
    </g>
  </g>

  <g transform="translate(72 554)">
    <rect width="1056" height="88" class="green"/>
    <text x="24" y="29" class="label white">04 / INFRASTRUCTURE BENEATH THE WORKFLOWS</text>
    <text x="24" y="62" font-family="Arial,sans-serif" font-size="23" font-weight="700" class="white">Oracle Cloud Ubuntu VM</text>
    <text x="335" y="61" class="body white">systemd services</text>
    <text x="505" y="61" class="body white">centralized logs</text>
    <text x="665" y="61" class="body white">controlled deployments</text>
    <text x="875" y="61" class="body white">24/7 processes</text>
  </g>
  <text x="72" y="670" class="label">DESIGNED FOR / ONLINE COMMUNITIES · E-COMMERCE OPERATIONS · SERVICE BUSINESSES · SMALL TEAMS</text>
</svg>
