<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kris Portfolio — Responsive Preview</title>
  <style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body { margin: 0; background: #101a18; color: #fffdf8; font: 14px/1.4 Inter, system-ui, sans-serif; }
    .preview-bar { position: sticky; z-index: 10; top: 0; display: flex; align-items: center; justify-content: space-between; gap: 20px; min-height: 68px; padding: 10px 18px; border-bottom: 1px solid #31413c; background: rgba(16,26,24,.96); }
    .preview-copy { display: flex; align-items: center; gap: 12px; }
    .preview-mark { display: grid; width: 38px; height: 38px; place-items: center; background: #ff5a35; color: #14221f; font: 800 12px/1 Consolas,monospace; }
    .preview-copy strong, .preview-copy span { display: block; }
    .preview-copy span { color: #9aaba4; font-size: 11px; }
    .controls { display: flex; flex-wrap: wrap; gap: 8px; }
    button { min-height: 38px; padding: 0 14px; border: 1px solid #566660; border-radius: 999px; background: transparent; color: #e7efeb; cursor: pointer; font-weight: 700; }
    button:hover { border-color: #ff5a35; }
    button[aria-pressed="true"] { border-color: #ff5a35; background: #ff5a35; color: #14221f; }
    .preview-stage { display: grid; justify-items: center; min-height: calc(100vh - 68px); padding: 24px; overflow: auto; }
    .device-frame { width: min(100%, 1440px); height: calc(100vh - 116px); min-height: 680px; overflow: hidden; border: 1px solid #42534d; background: #fff; box-shadow: 0 28px 80px rgba(0,0,0,.38); transition: width 320ms cubic-bezier(.16,1,.3,1); }
    .device-frame[data-device="tablet"] { width: min(100%, 820px); }
    .device-frame[data-device="phone"] { width: min(100%, 390px); }
    iframe { display: block; width: 100%; height: 100%; border: 0; background: #f4f0e7; }
    @media (max-width: 680px) {
      .preview-bar { align-items: flex-start; flex-direction: column; }
      .preview-stage { padding: 10px; }
      .device-frame { height: calc(100vh - 156px); min-height: 620px; }
    }
    @media (prefers-reduced-motion: reduce) { .device-frame { transition: none; } }
  </style>
</head>
<body>
  <header class="preview-bar">
    <div class="preview-copy"><span class="preview-mark">KR</span><div><strong>Portfolio responsive preview</strong><span>Private review controls — visitors do not see this bar</span></div></div>
    <div class="controls" aria-label="Preview device">
      <button type="button" data-device="desktop" aria-pressed="true">Desktop</button>
      <button type="button" data-device="tablet" aria-pressed="false">Tablet</button>
      <button type="button" data-device="phone" aria-pressed="false">Phone</button>
      <button type="button" data-reload>Reload page</button>
    </div>
  </header>
  <main class="preview-stage">
    <div class="device-frame" data-device="desktop"><iframe src="index.html" title="Kris portfolio responsive preview"></iframe></div>
  </main>
  <script>
    const frame = document.querySelector(".device-frame");
    const iframe = document.querySelector("iframe");
    const deviceButtons = [...document.querySelectorAll("button[data-device]")];
    deviceButtons.forEach((button) => {
      button.addEventListener("click", () => {
        frame.dataset.device = button.dataset.device;
        deviceButtons.forEach((candidate) => candidate.setAttribute("aria-pressed", String(candidate === button)));
      });
    });
    document.querySelector("[data-reload]").addEventListener("click", () => { iframe.src = iframe.src; });
  </script>
</body>
</html>
